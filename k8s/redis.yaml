---
# Redis deployment for the hot layer — real-time dashboard and cost alerting.
# For production, use Azure Cache for Redis (managed, HA) instead of this in-cluster instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: llmaven
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: llmaven
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
